name: Build GDevelop Game APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Zip Utility
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Merge and Extract GDevelop Files
        run: |
          mkdir game_files
          cat GDevelop_part1.zip GDevelop_part2.zip > combined.zip
          unzip -o combined.zip -d game_files/ || unzip -o GDevelop_part1.zip -d game_files/

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova for APK Building
        run: npm install -g cordova

      - name: Create Android Project
        run: |
          cordova create android_project com.mygame.gdevelop GDevelopGame
          cd android_project
          cordova platform add android
          rm -rf www/*
          cp -r ../game_files/* www/

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android_project
          cordova build android --release
      - name: Upload and Print Download Link
        run: |
          echo "======================================================="
          echo "DOWNLOAD YOUR APK FROM THE LINK BELOW:"
          curl --upload-file android_project/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk https://transfer.sh
          echo ""
          echo "======================================================="
          
          
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: my-gdevelop-game-apk
          path: android_project/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          
